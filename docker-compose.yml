# ============================================================================
# Full stack: PostgreSQL + API.
#
#   cp .env.example .env
#   node scripts/generate-secrets.mjs   # then paste into .env
#   # .env must define: POSTGRES_PASSWORD, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET,
#   #                   CORS_ORIGIN (explicit allowlist for production)
#   docker compose up -d --build
#   # API:      http://localhost:3000/api/...
#   # Swagger:  http://localhost:3000/api-docs
# ============================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: anime_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anime -d anime_platform']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://anime:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/anime_platform
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be an explicit origin allowlist in production}
      # Behind a reverse proxy/load balancer set this to the hop count (e.g. 1)
      # so rate limiting keys on the real client IP.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
